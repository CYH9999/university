name: Windows desktop build

# Builds the production Windows x64 installers (NSIS .exe and MSI) on a real Windows machine,
# installs the app like a user would, launches it, runs the end-to-end tests on Windows and
# uninstalls it again. The installers are uploaded as build artifacts.
#
# WebDriver needs WebView2 remote debugging, which the production build disables (DevTools off).
# The end-to-end tests therefore drive a separate test binary built from the same source with
# DevTools enabled (`--features tauri/devtools`) and a local debugging port
# (e2e/test-build-config.mjs). That binary is built after the installers and is never shipped.
on:
  push:
    branches: ["main", "claude/epic-hopper-k8u40l"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build, install and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and unit tests
        run: |
          npx tsc -b
          npx eslint .
          npx vitest run

      - name: Rust tests (including Windows path tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build production installers (NSIS + MSI)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: List installers
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/$env:TARGET/release/bundle"
          Get-ChildItem -Recurse $bundle -Include *.exe, *.msi | ForEach-Object {
            "{0}  {1:N1} MB  SHA256 {2}" -f $_.FullName, ($_.Length / 1MB), (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: University-1.0.0-windows-x64-installers
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Install with the NSIS installer (silent, current user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "University\University.exe"
          if (!(Test-Path $exe)) { throw "University.exe was not installed at $exe" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "University.lnk" | Select-Object -First 1
          if (!$lnk) { throw "Start Menu shortcut was not created" }
          Write-Host "Start Menu shortcut: $($lnk.FullName)"
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "University.lnk"
          if (!(Test-Path $desk)) { throw "Desktop shortcut was not created" }
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "University" }
          if (!$key) { throw "Uninstall entry (Apps & features) is missing" }
          $props = Get-ItemProperty $key.PSPath
          Write-Host "Apps & features: $($props.DisplayName) $($props.DisplayVersion) by $($props.Publisher)"
          "INSTALLED_APP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The installed app must not depend on development tools.
          Get-ChildItem (Split-Path $exe) | Format-Table Name, Length

      - name: Launch the installed app (no test tools involved)
        shell: pwsh
        run: |
          $since = Get-Date
          # Also ask for WebView2 remote debugging (the same way the E2E tests do): the production
          # build must refuse it.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "webview2-production-check"
          $p = Start-Process $env:INSTALLED_APP -PassThru
          Remove-Item Env:\WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, Env:\WEBVIEW2_USER_DATA_FOLDER
          Start-Sleep 20
          $webviews = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          if ($p.HasExited) {
            Write-Host "University exited with code $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -in 'Error', 'Critical' } | Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
            throw "University did not keep running after launch"
          }
          $proc = Get-Process -Id $p.Id
          Write-Host "University is running: pid $($p.Id), window '$($proc.MainWindowTitle)', responding=$($proc.Responding), WebView2 processes=$webviews"
          if ($proc.MainWindowTitle -ne "University") { throw "Main window 'University' not found" }
          if ($webviews -lt 1) { throw "WebView2 did not start" }
          $debuggable = $true
          try { Invoke-WebRequest "http://127.0.0.1:9222/json/version" -TimeoutSec 5 -UseBasicParsing | Out-Null } catch { $debuggable = $false }
          if ($debuggable) { throw "The production build exposes a WebView2 remote debugging port" }
          Write-Host "WebView2 remote debugging is disabled in the production build."
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3

      - name: Build the E2E test binary (same source, DevTools enabled, never shipped)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-bin | Out-Null
          node e2e/test-build-config.mjs e2e-bin/tauri.e2e.conf.json
          npx tauri build --target x86_64-pc-windows-msvc --no-bundle --features tauri/devtools --config "$PWD\e2e-bin\tauri.e2e.conf.json"
          Copy-Item "src-tauri/target/$env:TARGET/release/University.exe" e2e-bin/University.exe
          "E2E_APP=$PWD\e2e-bin\University.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install WebDriver tools (test machine only)
        shell: pwsh
        run: |
          # msedgedriver matching the installed WebView2 runtime (driven directly by e2e/lib.mjs).
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "E2E: onboarding, all pages in Arabic and English, restart, recovery"
        if: success() || failure()
        timeout-minutes: 30
        env:
          E2E_RESET_APPDATA: "1"
          E2E_ATTACH: "1"
        run: node e2e/smoke.mjs

      - name: "E2E: files, PDFs, persistence, notifications, backup and restore"
        if: success() || failure()
        timeout-minutes: 30
        env:
          E2E_RESET_APPDATA: "1"
          E2E_ATTACH: "1"
        run: node e2e/data.mjs

      - name: Uninstall (silent) and verify
        if: success() || failure()
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "University"
          if (!(Test-Path "$dir\uninstall.exe")) { throw "Uninstaller not found" }
          $workspacesBefore = @(Get-ChildItem e2e/.tmp -Recurse -Filter database.sqlite -ErrorAction SilentlyContinue).Count
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\University.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\University.exe") { throw "University.exe still present after uninstall" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "University.lnk" -ErrorAction SilentlyContinue
          if ($lnk) { throw "Start Menu shortcut still present after uninstall" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "University.lnk")) { throw "Desktop shortcut still present after uninstall" }
          # Uninstalling must never delete the user's workspace.
          $workspacesAfter = @(Get-ChildItem e2e/.tmp -Recurse -Filter database.sqlite -ErrorAction SilentlyContinue).Count
          if ($workspacesAfter -ne $workspacesBefore) { throw "Workspace data changed during uninstall ($workspacesBefore -> $workspacesAfter databases)" }
          Write-Host "Uninstalled; $workspacesAfter workspace database(s) kept."

      - name: MSI install, launch and uninstall
        if: success() || failure()
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/msi/*.msi" | Select-Object -First 1
          Write-Host "Installing $($msi.Name)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi-install.log" -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          Get-Content msi-install.log | Select-String -Pattern "Return value 3|Error|INSTALLDIR|Product:|Installation success|MainExecutable|Windows Installer (re)?installed" | Select-Object -Last 25
          if ($p.ExitCode -ne 0) { throw "MSI install failed ($($p.ExitCode))" }
          $entry = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq "University" } | Select-Object -First 1
          Write-Host "Apps & features (MSI): $($entry.DisplayName) $($entry.DisplayVersion) at '$($entry.InstallLocation)'"
          $exe = @(Get-ChildItem "$env:ProgramFiles\University", "${env:ProgramFiles(x86)}\University", $entry.InstallLocation -Filter University.exe -Recurse -ErrorAction SilentlyContinue)[0].FullName
          if (!$exe) { throw "MSI did not install University.exe" }
          Write-Host "Installed: $exe"
          $app = Start-Process $exe -PassThru
          Start-Sleep 15
          if ($app.HasExited) { throw "University exited right after launch (code $($app.ExitCode))" }
          Write-Host "MSI build launched and is running (pid $($app.Id))."
          Stop-Process -Id $app.Id -Force
          Start-Sleep 3
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed ($($p.ExitCode))" }
          if (Test-Path $exe) { throw "MSI uninstall left University.exe behind" }

      - name: Upload test screenshots and results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-results
          path: |
            e2e/.tmp/*/shots/*.png
            e2e/.tmp/*/results.json
            e2e/.tmp/*/driver.log
            msi-install.log
          if-no-files-found: ignore
